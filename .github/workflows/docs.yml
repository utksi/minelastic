name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[docs]" codespell==2.4.3 proselint==0.14.0
      - run: mkdocs build --strict
      - run: python tools/check_docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    # needs Settings > Pages > Source: GitHub Actions; skipped while the repository is private (no Pages)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
